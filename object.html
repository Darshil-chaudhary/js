<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object in javascript</title>
</head>
<body>
    <h1 id="data"></h1>
    <script>
        const person = {
            Name : "Darshil Chaudhry",
            Age : 24,
            City: "Gandhinagar",
            Contact : "9797845232",
        }

        document.getElementById("data").innerHTML = "User Name is:" +person["Name"] + "<br>Age is:" +person["Age"] + "<br>City :" +person["City"]
    </script>
</body>
</html>
