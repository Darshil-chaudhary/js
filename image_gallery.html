<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .title {
        text-align: center;
        color: rgb(214, 209, 219);
        background-color: rgb(56, 6, 102);
        height: 100px;
    }

    .title h1 {
        padding: 10px 8px;
    }

    .title h3 {
        color: rgb(248, 248, 163);
    }



    #container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }

    .card {
        width: 300px;
        border-radius: 10px;
        overflow: hidden;

    }

    .card img {
        width: 100%;
        height: 200px;
        display: block;
        transition: 0.3s;
        border-radius: 10px;
    }

    .card img:hover {
        transform: scale(1.05);
    }
</style>

<body>
    <div class="title">
        <h1>Javascript image gallery</h1>
        <h3>Use various tags for you image gallery</h3>
    </div>
    <div id="container"></div>
    <script src="./img_gallery.js"></script>

    <script>
        let card = "";

        for (i = 0; i < images.length; i++) {
            card += `
            <div class="card">
        <img src="${images[i].image}" alt="">
    </div>
            `
        }
        document.getElementById('container').innerHTML = card;
    </script>

</body>

</html>
