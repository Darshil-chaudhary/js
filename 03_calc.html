<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variable in javascript</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        /* justify-content: center; */
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
    }

    .card {
        width: 320px;
        padding: 20px;
        border-radius: 15px;
        background: white;
        text-align: center;
        background-color: rgb(7, 78, 120);
    }

    input {
        width: 100%;
        border-radius: 12px;
        padding: 10px 12px;
        margin: 10px 0px;
    }

    button {
        width: 100%;
        border-radius: 10px;
        padding: 8px;
    }
</style>

<body>
    <div class="card">
        <input type="number" id="num1" placeholder="Enter num1">
        <input type="number" id="num2" placeholder="Enter num2">
        <button onclick="addition()">+</button>
        <h2 id="ans"></h2>
    </div>

    <div class="card">
        <input type="number" id="sub1" placeholder="Enter num1">
        <input type="number" id="sub2" placeholder="Enter num2">
        <button onclick="subtraction()">-</button>
        <h2 id="subans"></h2>
    </div>

    <div class="card">
        <input type="number" id="mul1" placeholder="Enter num1">
        <input type="number" id="mul2" placeholder="Enter num2">
        <button onclick="multiplication()">*</button>
        <h2 id="mulans"></h2>
    </div>

    <div class="card">
        <input type="number" id="div1" placeholder="Enter num1">
        <input type="number" id="div2" placeholder="Enter num2">
        <button onclick="division()">/</button>
        <h2 id="divans"></h2>
    </div>

    <script>
        function addition() {
            let num1 = document.getElementById('num1').value;
            let num2 = document.getElementById('num2').value;
            let ans = parseInt(num1) + parseInt(num2);
            document.getElementById('ans').innerHTML = "Answer is :" + ans;
        }
        function subtraction() {
            let num1 = document.getElementById('sub1').value;
            let num2 = document.getElementById('sub2').value;
            let ans = parseInt(num1) - parseInt(num2);
            document.getElementById('subans').innerHTML = "Answer is:" + ans;
        }
        function multiplication(){
            let num1 = document.getElementById('mul1').value;
            let num2 = document.getElementById('mul2').value;
            let ans = parseInt(num1) * parseInt(num2);
            document.getElementById('mulans').innerHTML = "Answer is:" + ans; 
        }
        function division(){
            let num1 = document.getElementById('div1').value;
            let num2 = document.getElementById('div2').value;
            let ans = parseInt(num1) / parseInt(num2);
            document.getElementById('divans').innerHTML = "Answer is:" + ans; 
        }
    </script>
</body>

</html>
