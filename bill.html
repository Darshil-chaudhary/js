<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3 id="billshow"></h3>

    <script>
        let units =Number(prompt("enter your bill unit"));
        // let billshow=document.getElementById('billshow').value;


let bill;




if (units <= 100) {
    bill = units * 5;
}
else if (units <= 200) {
    bill = (100 * 5) + ((units - 100) * 7);
}
else {
    bill = (100 * 5) + (100 * 7) + ((units - 200) * 10);
}
document.getElementById('billshow').innerText = "total bill =" +bill;

    
    </script>
</body>
</html>
