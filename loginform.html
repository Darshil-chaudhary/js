<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            height: 100vh;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2, #ff6ec4);
        }

        .container {
            width: 450px;
            padding: 20px;
            /* box-shadow: 0 4px 10px rgba(0, 0, 0, .2); */
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        h2 {
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            margin: 15px 4px;
            padding: 10px 20px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.15);
            color: rgb(5, 5, 5);
            outline: none;
        }


        button {
            border-radius: 5px;
            padding: 10px 20px;
            color: white;
            /* background-color: rgb(127, 20, 227); */
            border: 0;
            margin-top: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            font-size: 16px;
            background: linear-gradient(135deg, #ff6ec4, #7873f5);

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        a {
            display: block;
            margin-bottom: 5px;
            margin-top: 5px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;

            opacity: 0.85;
        }

        #msg {
            margin-top: 10px;
            color: #fff;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login</h2>
        <input type="text" id="userEmail" placeholder="Enter Your Email">
        <input type="text" id="userPassword" placeholder="Enter Password">
        <a href="#">create an account?</a>
        <button onclick="authLogin()">Login</button>
        <h3 id="msg"></h3>
    </div>

    <script>
        function authLogin() {
            let userEmail = document.getElementById('userEmail').value;
            let userPasssword = document.getElementById('userPassword').value;

            let msg;

            let correctEmail = "darshilxtech@gmail.com";
            let correctPassword = "123@pipl";

            if (userEmail === correctEmail && userPasssword === correctPassword) {
                msg = "Login successfully..!";
            }
            else if (userEmail === "" && userPasssword === "") {
                msg = "All field are required..!";
            }
            else {
                msg = "Incorrect userEmail & Password";
            }

            document.getElementById('msg').innerText = msg;

        }
    </script>

</body>
